plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.playerwidget'
version = '0.1.0'

android {
  namespace "expo.modules.playerwidget"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // Même version que celle qu'embarque @rntp/player : c'est à SA session que
  // le widget parle, autant ne pas introduire une seconde version de media3.
  implementation 'androidx.media3:media3-session:1.9.2'
  implementation 'androidx.media3:media3-common:1.9.2'
}
