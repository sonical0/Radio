server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml;
    gzip_min_length 256;

    # En-têtes de durcissement. connect-src/media-src restent ouverts car
    # l'app laisse l'utilisateur ajouter des flux radio sur n'importe quel domaine.
    # Polices et favicon étant embarqués en data: URI, aucun hôte tiers n'est autorisé.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' https: http:; media-src 'self' https: http:; object-src 'none'; base-uri 'none'; frame-ancestors 'none';" always;

    # Tout est servi depuis l'image : sans revalidation, un rebuild du conteneur
    # laisserait un index.html périmé en cache navigateur. Les fichiers sont petits,
    # "no-cache" (revalider, pas re-télécharger) coûte un 304 et évite ce piège.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
